name: Test DooD Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker-check:
    name: Verify Docker Socket (DooD)
    runs-on: [self-hosted, dood-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker Daemon connection
        run: docker info

      - name: Build Docker Image
        run: docker build -t quickbite-service:test .
